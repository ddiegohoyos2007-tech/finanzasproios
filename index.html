<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FinanzasPro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#12233f">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinanzasPro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Dirección visual: app móvil clara, cabecera azul marino que se extiende en cada pantalla, tarjetas blancas, acento azul. */
:root {
  --navy: #12233f;
  --navy-2: #1b335c;
  --bg: #f1f3f8;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-2: #566074;
  --ink-3: #8a94a6;
  --line: #e4e8f0;
  --fill: #eef1f7;
  --accent: #2a78d6;
  --accent-soft: #e3eefc;
  --good: #0b8a55;
  --good-soft: #def5ea;
  --bad: #c9302f;
  --bad-soft: #fde7e6;
  --warn: #a8610a;
  --warn-soft: #fcefd5;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 14px rgba(15, 23, 42, .05);
  /* paleta categórica (ver dataviz): 8 ranuras con orden fijo */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s0: #8a94a6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0d1a30; --navy-2: #16294a;
    --bg: #0a0e16; --card: #141a26; --ink: #edf1f7; --ink-2: #a3aec2; --ink-3: #6f7b90;
    --line: #232b3b; --fill: #1c2433; --accent: #3987e5; --accent-soft: #17283f;
    --good: #3dd598; --good-soft: #12302a; --bad: #ff7b7b; --bad-soft: #3a1b1f;
    --warn: #f5a524; --warn-soft: #382a10;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s0: #6f7b90;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0d1a30; --navy-2: #16294a;
  --bg: #0a0e16; --card: #141a26; --ink: #edf1f7; --ink-2: #a3aec2; --ink-3: #6f7b90;
  --line: #232b3b; --fill: #1c2433; --accent: #3987e5; --accent-soft: #17283f;
  --good: #3dd598; --good-soft: #12302a; --bad: #ff7b7b; --bad-soft: #3a1b1f;
  --warn: #f5a524; --warn-soft: #382a10;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s0: #6f7b90;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; }
html {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  height: 100%;
}
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, a, [role="button"], .tap { touch-action: manipulation; }
button, [role="button"], .tap, .tab, .chip, .seg button { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }

/* ---------- estructura ---------- */
#app { max-width: 480px; height: 100dvh; margin: 0 auto; position: relative; background: var(--bg); overflow: hidden; }
@media (min-width: 520px) { #app { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, .12); } }
.scrim { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 6; }
.view { height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.top { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 22px; border-radius: 0 0 26px 26px; }
.top.flat { padding-bottom: 14px; }
.nav { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.nav h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; flex: 1; }
.nav .iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); color: #fff; }
.nav .iconbtn:active { background: rgba(255, 255, 255, .2); }
.content { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 16px; }
.content.pull { margin-top: -6px; }

.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.card h2, .sec h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec .head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 2px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* ---------- hero ---------- */
.hero-label { font-size: 13px; opacity: .72; margin-top: 10px; }
.hero-amt { font-size: 38px; font-weight: 700; letter-spacing: -.03em; margin: 2px 0 14px; }
.hero-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill-stat { background: rgba(255, 255, 255, .09); border-radius: 14px; padding: 10px 12px; }
.pill-stat .l { font-size: 12px; opacity: .72; display: flex; align-items: center; gap: 5px; }
.pill-stat .v { font-size: 17px; font-weight: 650; margin-top: 2px; }
.monthnav { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; background: rgba(255, 255, 255, .09); border-radius: 14px; padding: 4px; }
.monthnav button { width: 40px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: #fff; }
.monthnav button:active { background: rgba(255, 255, 255, .16); }
.monthnav button[disabled] { opacity: .3; }
.monthnav span { font-weight: 600; font-size: 15px; }

/* ---------- cuentas ---------- */
.accs { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.accs::-webkit-scrollbar { display: none; }
.acc { flex: 0 0 76%; max-width: 280px; scroll-snap-align: start; color: #fff; border-radius: 18px; padding: 14px 16px; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; position: relative; overflow: hidden; }
.acc::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .09); }
.acc:active { transform: scale(.98); }
.acc .t { display: flex; align-items: center; gap: 8px; font-size: 14px; opacity: .92; }
.acc .b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.acc .s { font-size: 12px; opacity: .75; }
.acc.add { background: var(--fill); color: var(--ink-2); border: 1.5px dashed var(--line); align-items: center; justify-content: center; gap: 6px; flex: 0 0 140px; text-align: center; }
.acc.add::after { display: none; }

/* ---------- filas ---------- */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-align: left; width: 100%; min-height: 60px; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--fill); }
.row .grow { flex: 1; min-width: 0; }
.row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 650; text-align: right; white-space: nowrap; }
.row .amt small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); }
.cico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: none; }
.cico.sm { width: 32px; height: 32px; border-radius: 10px; }
.cico.soft { background: var(--fill) !important; color: var(--ink-2); }
.dayhead { display: flex; justify-content: space-between; padding: 14px 18px 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chev { color: var(--ink-3); }

/* ---------- controles ---------- */
.seg { display: flex; background: var(--fill); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; margin: 0 -16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chip.on { background: var(--accent); color: #fff; }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 12px; box-shadow: var(--shadow); color: var(--ink-3); }
.search input { flex: 1; border: 0; background: none; padding: 12px 0; outline: none; min-width: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; font-weight: 650; background: var(--accent); color: #fff; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.sec2 { background: var(--fill); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { width: auto; padding: 9px 14px; font-size: 14px; border-radius: 11px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.inp { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); outline: none; appearance: none; -webkit-appearance: none; }
select.inp { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
.inp:focus { border-color: var(--accent); }
.form { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid transparent; }
.sw.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 999px; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.mut { background: var(--fill); color: var(--ink-2); }
.notice { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.notice button { color: var(--accent); font-weight: 650; white-space: nowrap; }
.empty { text-align: center; color: var(--ink-2); padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.switch { width: 51px; height: 31px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--good); }
.switch.on::after { transform: translateX(20px); }

/* ---------- barra inferior ---------- */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.tab.on { color: var(--accent); }
.tab:active { transform: scale(.94); }
.fab { position: absolute; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 20px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(42, 120, 214, .45); z-index: 4; }
.fab:active { transform: scale(.94); }

/* ---------- presupuestos / metas ---------- */
.bar { height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.warn > i { background: #e29a1a; }
.bar.bad > i { background: var(--bad); }
.bar.good > i { background: var(--good); }
.brow { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; width: 100%; text-align: left; }
.brow + .brow { border-top: 1px solid var(--line); }
.brow:active { background: var(--fill); }
.brow .l { display: flex; align-items: center; gap: 12px; }
.brow .nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }

/* ---------- gráficos ---------- */
.donutwrap { display: flex; justify-content: center; padding: 4px 0 8px; }
.donut { width: 220px; height: 220px; }
.seg-c { cursor: pointer; transition: stroke-width .15s; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart text { fill: var(--ink-2); font-size: 11px; font-family: inherit; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.readout { display: flex; gap: 16px; font-size: 14px; flex-wrap: wrap; }
.readout b { font-weight: 650; }
.mini { display: flex; align-items: flex-end; gap: 8px; height: 92px; }
.mini .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.mini .c i { display: block; width: 100%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--accent) 38%, var(--card)); }
.mini .c.today i { background: var(--accent); }
.mini .c span { font-size: 11px; color: var(--ink-3); }
.mini .c.today span { color: var(--ink); font-weight: 700; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--fill); border-radius: 14px; padding: 12px; }
.kpi .l { font-size: 12px; color: var(--ink-2); }
.kpi .v { font-size: 18px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; }

/* ---------- hoja inferior ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 12, 22, .5); opacity: 0; transition: opacity .22s; }
.sheet { position: relative; width: 100%; max-width: 480px; max-height: 94dvh; background: var(--bg); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { padding: 10px 0 6px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; justify-content: space-between; }
.amtbox { text-align: center; padding: 4px 0; }
.amtbox .cur { font-size: 13px; color: var(--ink-2); }
.amtbox .amt { font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.amtbox .amt.expense { color: var(--bad); }
.amtbox .amt.income { color: var(--good); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys button { height: 50px; border-radius: 14px; background: var(--card); font-size: 22px; font-weight: 500; box-shadow: var(--shadow); display: grid; place-items: center; }
.keys button:active { background: var(--fill); transform: scale(.96); }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px; }
.cats::-webkit-scrollbar { display: none; }
.cchip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 74px; padding: 8px 2px; border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); border: 2px solid transparent; }
.cchip span.n { max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.iconpick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.iconpick button { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; background: var(--fill); color: var(--ink-2); }
.iconpick button.on { background: var(--accent); color: #fff; }

/* ---------- bloqueo y aviso ---------- */
.lock { position: fixed; inset: 0; z-index: 40; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; }
.dots { display: flex; gap: 16px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
.dots i.on { background: #fff; }
.lock .keys { width: 100%; max-width: 300px; }
.lock .keys button { background: rgba(255, 255, 255, .1); color: #fff; box-shadow: none; height: 58px; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 50; opacity: 0; transition: .2s; max-width: 90%; text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (hover: hover) and (pointer: fine) {
  .row:hover, .brow:hover { background: var(--fill); }
  .chip:hover { filter: brightness(.97); }
  .btn:hover { filter: brightness(1.06); }
  .tab:hover { color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* FinanzasPro: app de finanzas personales (PWA). Todo en un archivo, sin dependencias. */

// ============ utilidades ============
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const curMonth = () => todayISO().slice(0, 7);
const addMonths = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function balances() {

    if (r.type === 'transfer') { if (r.accountId in m) m[r.accountId] -= r.amount; if (r.toAccountId in m) m[r.toAccountId] += (r.toAmount ?? r.amount); }

}

const monthRecs = k => S.records.filter(r => r.date.startsWith(k));

  let inc = 0, exp = 0;
  for (const r of monthRecs(k)) { if (r.type === 'income') inc += baseAmount(r); else if (r.type === 'expense') exp += baseAmount(r); }

}

function stepDate(s, freq) {
  const d = parseISO(s);
  if (freq === 'weekly') d.setDate(d.getDate() + 7);
  else if (freq === 'biweekly') d.setDate(d.getDate() + 14);
  else if (freq === 'yearly') d.setFullYear(d.getFullYear() + 1);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  return iso(d);
}
function processPlanned() {
  let changed = false; const t = todayISO();
  for (const p of S.planned) {
    if (!p.active || !acc(p.accountId)) continue;
    let guard = 0;
    while (p.next <= t && guard++ < 36) {
      S.records.push({ id: uid(), type: p.type, amount: p.amount, accountId: p.accountId, catId: p.catId, date: p.next, note: p.note || '', t: parseISO(p.next).getTime() + 1, pid: p.id });
      p.next = stepDate(p.next, p.freq); changed = true;
    }
  }
  if (changed) { S.records.sort((a, b) => b.t - a.t); save(); }
}

function last7() {

}

// ---- Presupuestos ----
function budgetRows(k) {

  return S.budgets.map(b => { const c = b.catId ? cat(b.catId) : null; const s = b.catId ? (spent.get(b.catId) || 0) : tot; return { b, c, s, ratio: b.limit ? s / b.limit : 0 }; }).sort((a, b) => b.ratio - a.ratio);
}
function budgetStatus(ratio, left) {

}

}

  const lim = totalB ? totalB.b.limit : sumLimit, sp = totalB ? totalB.s : sumSpent;

// ---- Estadísticas ----
function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barPath(x, y, w, base, r) { const h = base - y; if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x} ${base}V${y + r}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${base}z`; }
function viewStats() {
  const type = ui.statType; const tot = catTotals(ui.month, type); const sum = [...tot.values()].reduce((a, b) => a + b, 0);
  let items = [...tot.entries()].map(([id, v]) => ({ id, c: cat(id), v })).sort((a, b) => b.v - a.v);
  const keep = items.filter(i => i.c && i.c.color > 0), rest = items.filter(i => !(i.c && i.c.color > 0));
  const restV = rest.reduce((s, i) => s + i.v, 0);
  const slices = keep.map(i => ({ name: i.c.name, v: i.v, color: `var(--s${i.c.color})`, icon: i.c.icon, id: i.id })); if (restV > 0) slices.push({ name: 'Otros', v: restV, color: 'var(--s0)', icon: 'tag', id: '_otros' });
  const R = 72, W = 24, C = 2 * Math.PI * R; let off = 0; const gap = slices.length > 1 ? 3 : 0;
  const sel = ui.sel != null && slices[ui.sel] ? slices[ui.sel] : null;
  const segs = slices.map((s, i) => { const len = s.v / sum * C, dash = Math.max(len - gap, .5); const el = `<circle class="seg-c" data-a="dsel" data-i="${i}" cx="100" cy="100" r="${R}" fill="none" stroke="${s.color}" stroke-width="${sel === s ? W + 6 : W}" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += len; return el; }).join('');
  const center = sel ? `<text x="100" y="92" text-anchor="middle" style="font-size:12px">${esc(sel.name)}</text><text x="100" y="112" text-anchor="middle" style="font-size:18px;font-weight:700;fill:var(--ink)">${fmt(sel.v, null, 0)}</text><text x="100" y="128" text-anchor="middle" style="font-size:12px">${Math.round(sel.v / sum * 100)}%</text>`
    : `<text x="100" y="96" text-anchor="middle" style="font-size:12px">${type === 'expense' ? 'Gastos' : 'Ingresos'}</text><text x="100" y="118" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--ink)">${fmt(sum, null, 0)}</text>`;
  const { inc, exp } = monthTotals(ui.month); const net = inc - exp; const rate = inc > 0 ? net / inc * 100 : 0;
  const dim = daysInMonth(ui.month), days = ui.month === curMonth() ? new Date().getDate() : dim;

  // barras: últimos 6 meses
  const months = []; for (let i = 5; i >= 0; i--) { const k = addMonths(ui.month, -i); months.push({ k, ...monthTotals(k) }); }
  const mx = niceMax(Math.max(...months.map(m => Math.max(m.inc, m.exp)))); const VW = 340, VH = 176, L = 38, T = 8, B = 28, ph = VH - T - B, pw = VW - L - 4, gw = pw / 6, bw = 14;
  const yv = v => T + ph - v / mx * ph;
  const grid = [0, .5, 1].map(f => `<line class="grid" x1="${L}" x2="${VW - 4}" y1="${yv(mx * f)}" y2="${yv(mx * f)}"/><text x="${L - 6}" y="${yv(mx * f) + 4}" text-anchor="end">${f === 0 ? '0' : compactFmt.format(mx * f)}</text>`).join('');
  const bars = months.map((m, i) => { const cx = L + gw * i + gw / 2, on = ui.barSel === i;
    return `<g ${on ? '' : 'opacity=".62"'}><path d="${barPath(cx - bw - 1, yv(m.inc), bw, T + ph, 4)}" fill="var(--s1)"/><path d="${barPath(cx + 1, yv(m.exp), bw, T + ph, 4)}" fill="var(--s2)"/></g><text x="${cx}" y="${VH - 8}" text-anchor="middle" ${on ? 'style="fill:var(--ink);font-weight:700"' : ''}>${monthShort(m.k)}</text><rect data-a="bsel" data-i="${i}" x="${cx - gw / 2}" y="${T}" width="${gw}" height="${ph + B}" fill="transparent"/>`; }).join('');
  const bs = months[ui.barSel] || months[5];
  return `<header class="top flat"><div class="nav"><h1>Estadísticas</h1></div>${monthNav()}</header>
  <div class="content">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="seg" role="tablist"><button class="${type === 'expense' ? 'on' : ''}" data-a="stype" data-v="expense">Gastos</button><button class="${type === 'income' ? 'on' : ''}" data-a="stype" data-v="income">Ingresos</button></div>
      ${sum > 0 ? `<div class="donutwrap"><svg class="donut chart" viewBox="0 0 200 200" role="img" aria-label="${type === 'expense' ? 'Gastos' : 'Ingresos'} por categoría en ${monthLabel(ui.month)}: ${slices.map(s => s.name + ' ' + fmt(s.v, null, 0)).join(', ')}">${segs}${center}</svg></div>
      <div class="list" style="margin:0 -16px">${slices.map((s, i) => `<button class="row" data-a="dsel" data-i="${i}" style="padding:10px 16px;min-height:52px"><div class="cico sm" style="background:${s.color}">${icon(s.icon, 18)}</div><div class="grow"><div class="t1">${esc(s.name)}</div></div><div class="amt num">${fmt(s.v)}<small>${(s.v / sum * 100).toFixed(1).replace('.', ',')}%</small></div></button>`).join('')}</div>` : `<div class="empty">${icon('pie', 34, 1.5)}<span class="small">Sin ${type === 'expense' ? 'gastos' : 'ingresos'} en ${monthLabel(ui.month).toLowerCase()}.</span></div>`}
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>Resumen del mes</h2>
      <div class="kpis"><div class="kpi"><div class="l">Balance del mes</div><div class="v num ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : '−'}${fmt(Math.abs(net))}</div></div><div class="kpi"><div class="l">Tasa de ahorro</div><div class="v num">${inc > 0 ? rate.toFixed(0) + '%' : '—'}</div></div>
      <div class="kpi"><div class="l">Gasto promedio diario</div><div class="v num">${fmt(exp / Math.max(1, days))}</div></div><div class="kpi"><div class="l">Movimientos</div><div class="v num">${monthRecs(ui.month).length}</div></div></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Ingresos y gastos</h2><button class="link" data-a="tbl">${ui.table ? 'Ver gráfico' : 'Ver tabla'}</button></div>
      <div class="legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Gastos</span></div>
      ${ui.table ? `<table class="data"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th></tr></thead><tbody>${months.map(m => `<tr><td>${monthShort(m.k)}</td><td class="num">${fmt(m.inc, null, 0)}</td><td class="num">${fmt(m.exp, null, 0)}</td></tr>`).join('')}</tbody></table>`
        : `<svg class="chart" viewBox="0 0 ${VW} ${VH}" width="100%" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">${grid}${bars}</svg>
      <div class="readout"><span><b>${monthLabel(bs.k)}</b></span><span style="color:var(--ink-2)"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s1);margin-right:5px"></i>Ingresos <b class="num" style="color:var(--ink)">${fmt(bs.inc)}</b></span><span style="color:var(--ink-2)"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s2);margin-right:5px"></i>Gastos <b class="num" style="color:var(--ink)">${fmt(bs.exp)}</b></span></div>`}
    </div>
  </div>`;
}

// ============ hojas ============
let sheetEl = null;
function openSheet(html, onMount) {
  closeSheet(true);
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="backdrop" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"><span></span></div><div class="sheet-body">${html}</div></div>`;
  document.body.appendChild(w); sheetEl = w; requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  const sh = $('.sheet', w), grab = $('.grab', w); let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sh.style.transition = 'none'; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
  onMount && onMount(w); return w;
}
function closeSheet(instant) { if (!sheetEl) return; const w = sheetEl; sheetEl = null; if (instant) { w.remove(); return; } w.classList.remove('open'); setTimeout(() => w.remove(), 240); }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); requestAnimationFrame(() => t.classList.add('show')); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2200); }
function confirmSheet(title, msg, label, onOk, danger = true) {
  openSheet(`<div class="sheet-title">${title}</div><p class="muted">${msg}</p><button class="btn ${danger ? 'danger' : ''}" id="ok">${label}</button><button class="btn sec2" data-a="closeSheet">Cancelar</button>`, w => { $('#ok', w).onclick = () => { closeSheet(); onOk(); }; });
}
const field = (label, inner, id) => `<div class="field"><label ${id ? `for="${id}"` : ''}>${label}</label>${inner}</div>`;
const opts = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');
const accOpts = sel => opts(S.accounts.map(a => [a.id, `${a.name} (${a.currency})`]), sel);

// ---- registrar movimiento ----
function recordSheet(rec) {
  if (!S.accounts.length) { toast('Crea una cuenta primero'); return accountSheet(); }

  if (d.type !== 'transfer' && !cat(d.catId)) d.catId = S.categories.find(c => c.type === d.type)?.id || null;
  openSheet('', w => {
    const body = $('.sheet-body', w);
    const sync = () => { const n = $('#f_note', w), dt = $('#f_date', w), a = $('#f_acc', w), b = $('#f_to', w); if (n) d.note = n.value; if (dt && dt.value) d.date = dt.value; if (a) d.accountId = a.value; if (b) d.toAccountId = b.value; };
    const draw = () => {
      const tp = d.type, cur = acc(d.accountId)?.currency || S.settings.currency;
      body.innerHTML = `<div class="sheet-title"><span>${rec ? 'Editar movimiento' : 'Nuevo movimiento'}</span>${rec ? `<button class="iconbtn" data-k="del" aria-label="Eliminar" style="color:var(--bad);width:40px;height:40px;display:grid;place-items:center">${icon('trash', 22)}</button>` : ''}</div>

      <div class="two">${tp === 'transfer' ? `${field('Desde', `<select class="inp" id="f_acc">${accOpts(d.accountId)}</select>`, 'f_acc')}${field('Hacia', `<select class="inp" id="f_to">${accOpts(d.toAccountId)}</select>`, 'f_to')}` : `${field('Cuenta', `<select class="inp" id="f_acc">${accOpts(d.accountId)}</select>`, 'f_acc')}${field('Fecha', `<input class="inp" type="date" id="f_date" value="${d.date}">`, 'f_date')}`}</div>
      ${tp === 'transfer' ? field('Fecha', `<input class="inp" type="date" id="f_date" value="${d.date}">`, 'f_date') : ''}
      ${field('Nota', `<input class="inp" id="f_note" placeholder="Opcional" maxlength="80" value="${esc(d.note)}" autocomplete="off" enterkeyhint="done">`, 'f_note')}
      <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'].map(k => `<button data-k="key" data-v="${k}" aria-label="${k === 'del' ? 'Borrar' : k}">${k === 'del' ? icon('back', 24) : k}</button>`).join('')}</div>
      <button class="btn" data-k="save">${icon('check', 20, 2.4)} Guardar</button>`;
    };
    draw();
    w.addEventListener('click', e => {
      const el = e.target.closest('[data-k]'); if (!el) return; const k = el.dataset.k, v = el.dataset.v;
      if (k === 'type') { sync(); d.type = v; if (v !== 'transfer' && cat(d.catId)?.type !== v) d.catId = S.categories.find(c => c.type === v)?.id || null; draw(); }
      else if (k === 'cat') { d.catId = v; $$('.cchip', w).forEach(c => c.classList.toggle('on', c.dataset.v === v)); }
      else if (k === 'key') {
        let s = d.amount;
        if (v === 'del') s = s.length > 1 ? s.slice(0, -1) : '0';
        else if (v === ',') { if (!s.includes(',')) s += ','; }
        else { const dec = s.split(',')[1]; if ((dec == null || dec.length < 2) && s.replace(',', '').length < 11) s = s === '0' ? v : s + v; }

      else if (k === 'save') {
        sync(); const amt = num(d.amount);

      }
    });
    w.addEventListener('change', e => { if (e.target.id === 'f_acc') { d.accountId = e.target.value; $('#curlbl', w).textContent = acc(d.accountId)?.currency || ''; } });
  });
}

      else if (k === 'save') {
        read(); const a = num(d.amount); if (!(a > 0)) { toast('Ingresa un monto mayor a 0'); return; } if (!d.note.trim()) { toast('Escribe un nombre'); return; }
        const o = { id: p?.id || uid(), type: d.type, amount: round2(a), accountId: d.accountId, catId: d.catId, note: d.note.trim(), freq: d.freq, next: d.next, active: d.active };
        if (p) S.planned = S.planned.map(x => x.id === p.id ? o : x); else S.planned.push(o);
        save(); closeSheet(); processPlanned(); render(); toast('Pago guardado');
      }
    });
  });
}

// ---- categoría ----
function catSheet(c) {
  const d = c ? { ...c } : { name: '', type: 'expense', icon: 'tag', color: nextFreeSlot('expense') };
  openSheet('', w => {
    const body = $('.sheet-body', w);
    const draw = () => { body.innerHTML = `<div class="sheet-title">${c ? 'Editar categoría' : 'Nueva categoría'}</div><div class="form">
      ${c ? '' : `<div class="seg">${[['expense', 'Gasto'], ['income', 'Ingreso']].map(t => `<button class="${d.type === t[0] ? 'on' : ''}" data-k="type" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`}
      ${field('Nombre', `<input class="inp" id="c_name" value="${esc(d.name)}" maxlength="28" autocomplete="off">`, 'c_name')}
      <div class="field"><label>Icono</label><div class="iconpick">${PICK_ICONS.map(i => `<button data-k="icon" data-v="${i}" class="${d.icon === i ? 'on' : ''}" aria-label="${i}">${icon(i, 20)}</button>`).join('')}</div></div>
      <div class="field"><label>Color</label><div class="swatches">${[1, 2, 3, 4, 5, 6, 7, 8, 0].map(s => `<button class="sw ${d.color === s ? 'on' : ''}" data-k="color" data-v="${s}" style="background:var(--s${s})" aria-label="Color ${s}"></button>`).join('')}</div><div class="small muted">Las categorías sin color se agrupan en “Otros” en las gráficas.</div></div>
      <button class="btn" data-k="save">Guardar</button>${c ? `<button class="btn danger" data-k="del">Eliminar</button>` : ''}</div>`; };
    draw();
    w.addEventListener('click', e => {
      const el = e.target.closest('[data-k]'); if (!el) return; const k = el.dataset.k;
      if (k === 'type') { d.name = $('#c_name', w).value; d.type = el.dataset.v; d.color = nextFreeSlot(d.type); draw(); }
      else if (k === 'icon') { d.name = $('#c_name', w).value; d.icon = el.dataset.v; draw(); }
      else if (k === 'color') { d.name = $('#c_name', w).value; d.color = +el.dataset.v; draw(); }
      else if (k === 'del') confirmSheet('¿Eliminar categoría?', 'Los movimientos que la usan quedarán “Sin categoría”.', 'Eliminar', () => { S.categories = S.categories.filter(x => x.id !== c.id); S.budgets = S.budgets.filter(b => b.catId !== c.id); save(); render(); });
      else if (k === 'save') { const name = $('#c_name', w).value.trim(); if (!name) { toast('Escribe un nombre'); return; } const o = { id: c?.id || uid(), name, type: d.type, icon: d.icon, color: d.color }; if (c) S.categories = S.categories.map(x => x.id === c.id ? o : x); else S.categories.push(o); save(); closeSheet(); render(); }
    });
  });
}

// ============ PIN ============
async function hashPin(p) {
  const s = 'fp1:' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'x' + h; }
}
function keypadHTML() { return `<div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<span></span>' : `<button data-p="${k}" aria-label="${k === 'del' ? 'Borrar' : k}">${k === 'del' ? icon('back', 24) : k}</button>`).join('')}</div>`; }
function pinPad(title, sub, onDone, cancel) {
  const el = document.createElement('div'); el.className = 'lock'; let v = '';
  el.innerHTML = `<div style="text-align:center"><div class="cico" style="background:rgba(255,255,255,.12);margin:0 auto 14px;width:56px;height:56px;border-radius:18px">${icon('lock', 26)}</div><h2 style="font-size:22px">${title}</h2><p id="ps" style="opacity:.7;margin-top:4px;font-size:14px">${sub}</p></div><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>${keypadHTML()}${cancel ? `<button data-x style="opacity:.8;padding:8px">Cancelar</button>` : ''}`;
  document.body.appendChild(el);
  const upd = () => $$('#dots i', el).forEach((d, i) => d.classList.toggle('on', i < v.length));
  el.onclick = async e => {
    if (e.target.closest('[data-x]')) { el.remove(); cancel && cancel(); return; }
    const b = e.target.closest('[data-p]'); if (!b) return; const k = b.dataset.p;
    if (k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += k; upd();
    if (v.length === 4) { const r = await onDone(v, el); if (r === 'reset') { v = ''; upd(); const d = $('#dots', el); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); } else if (r === 'close') el.remove(); }
  };
  return el;
}
function lockApp() {
  if (!S.settings.pin || locked) return; locked = true;
  pinPad('Ingresa tu PIN', 'Tus finanzas están protegidas', async v => { if (await hashPin(v) === S.settings.pin) { locked = false; render(); return 'close'; } $('#ps').textContent = 'PIN incorrecto, inténtalo otra vez'; return 'reset'; });
}
function setupPin() {
  let first = null;
  pinPad('Crea tu PIN', 'Elige 4 dígitos', async (v, el) => {
    if (first == null) { first = v; $('h2', el).textContent = 'Confirma tu PIN'; $('#ps', el).textContent = 'Escríbelo otra vez'; return 'reset'; }
    if (v !== first) { first = null; $('h2', el).textContent = 'Crea tu PIN'; $('#ps', el).textContent = 'No coinciden, vuelve a empezar'; return 'reset'; }
    S.settings.pin = await hashPin(v); save(); render(); toast('PIN activado'); return 'close';
  }, () => { });
}

// ============ respaldo ============
function exportData() {
  const json = JSON.stringify(S, null, 2); const name = `finanzaspro-respaldo-${todayISO()}.json`;
  openSheet(`<div class="sheet-title">Exportar respaldo</div><p class="muted small">Guarda este archivo en un lugar seguro. Puedes restaurarlo desde Importar respaldo.</p><button class="btn" id="x_share">${icon('download', 20)} Guardar archivo</button><button class="btn sec2" id="x_copy">Copiar como texto</button>`, w => {
    $('#x_share', w).onclick = async () => {
      try { const f = new File([json], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Respaldo FinanzasPro' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { const u = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Descargando respaldo'); } catch (e) { toast('No se pudo guardar. Usa Copiar como texto'); }
    };
    $('#x_copy', w).onclick = async () => { try { await navigator.clipboard.writeText(json); toast('Respaldo copiado'); } catch (e) { toast('No se pudo copiar'); } };
  });
}
function importData() {
  openSheet(`<div class="sheet-title">Importar respaldo</div><p class="muted small">Esto reemplaza los datos actuales de la app.</p><label class="btn sec2" for="i_file" style="cursor:pointer">${icon('upload', 20)} Elegir archivo</label><input type="file" id="i_file" accept=".json,application/json" hidden>${field('O pega el texto del respaldo', `<textarea class="inp" id="i_txt" rows="4" placeholder="{ ... }"></textarea>`, 'i_txt')}<button class="btn" id="i_ok">Importar</button>`, w => {
    const apply = txt => { try { const o = JSON.parse(txt); if (!o || !Array.isArray(o.accounts) || !Array.isArray(o.records)) throw 0; S = normalize(o); save(); applyTheme(); closeSheet(); ui.sub = null; render(); toast('Respaldo importado'); } catch (e) { toast('El respaldo no es válido'); } };
    $('#i_file', w).onchange = e => { const f = e.target.files[0]; if (f) f.text().then(apply); };
    $('#i_ok', w).onclick = () => apply($('#i_txt', w).value);
  });
}

// ============ acciones ============
const A = {
  tab: el => { ui.tab = el.dataset.v; ui.sub = null; ui.sel = null; render(); },
  sub: el => { ui.sub = el.dataset.v; render(); },
  back: () => { ui.sub = null; render(); },
  mprev: () => { ui.month = addMonths(ui.month, -1); ui.sel = null; ui.barSel = 5; render(); },
  mnext: () => { if (ui.month < curMonth()) { ui.month = addMonths(ui.month, 1); ui.sel = null; ui.barSel = 5; render(); } },
  filter: el => { ui.filter = el.dataset.v; render(); },
  accF: el => { ui.accF = el.dataset.v; render(); },
  stype: el => { ui.statType = el.dataset.v; ui.sel = null; render(); },
  dsel: el => { const i = +el.dataset.i; ui.sel = ui.sel === i ? null : i; render(); },
  bsel: el => { ui.barSel = +el.dataset.i; render(); },
  tbl: () => { ui.table = !ui.table; render(); },
  closeSheet: () => closeSheet(),
  addRec: () => recordSheet(),
  editRec: el => recordSheet(S.records.find(r => r.id === el.dataset.id)),
  addAcc: () => accountSheet(),
  editAcc: el => accountSheet(acc(el.dataset.id)),
  addBudget: () => budgetSheet(),
  editBudget: el => budgetSheet(S.budgets.find(b => b.id === el.dataset.id)),
  addGoal: () => goalSheet(),
  editGoal: el => goalSheet(S.goals.find(g => g.id === el.dataset.id)),
  contrib: el => contribSheet(S.goals.find(g => g.id === el.dataset.id)),
  addPlanned: () => plannedSheet(),
  editPlanned: el => plannedSheet(S.planned.find(p => p.id === el.dataset.id)),
  addCat: () => catSheet(),
  editCat: el => catSheet(cat(el.dataset.id)),
  theme: el => { S.settings.theme = el.dataset.v; save(); applyTheme(); render(); },
  pinToggle: () => { if (S.settings.pin) confirmSheet('¿Quitar el PIN?', 'La app se abrirá sin pedir código.', 'Quitar PIN', () => { S.settings.pin = null; save(); render(); }); else setupPin(); },
  exportData, importData,
  clearDemo: () => confirmSheet('¿Empezar con tus datos?', 'Se borrarán los datos de ejemplo. Crearemos una cuenta de efectivo para que empieces.', 'Borrar ejemplos', () => { const keep = S.settings; S = blank(); S.settings = keep; S.accounts.push({ id: uid(), name: 'Efectivo', type: 'cash', currency: keep.currency, start: 0, color: ACC_COLORS[1] }); save(); ui.sub = null; render(); toast('Todo listo'); }, false),
  loadDemo: () => confirmSheet('¿Cargar datos de ejemplo?', 'Esto reemplaza tus datos actuales.', 'Cargar ejemplo', () => { const keep = S.settings; S = demoData(); S.settings = { ...keep, rates: { ...keep.rates, USD: keep.rates.USD || 3.5 } }; save(); ui.sub = null; render(); }),
  wipe: () => confirmSheet('¿Borrar todo?', 'Se eliminarán cuentas, movimientos, presupuestos y metas. Exporta un respaldo antes si lo necesitas.', 'Borrar todo', () => { const keep = S.settings; S = blank(); S.settings = keep; save(); ui.sub = null; ui.tab = 'home'; render(); toast('Datos borrados'); }),
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) A[el.dataset.a](el, e); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* tipo search */ } } }
  else if (e.target.dataset && e.target.dataset.rate) { const v = num(e.target.value); if (v > 0) { S.settings.rates[e.target.dataset.rate] = v; save(); } }
});
document.addEventListener('change', e => {
  if (e.target.id === 's_cur') { const old = S.settings.currency, nu = e.target.value; const oldRate = rateOf(nu); const r = {}; for (const [c, v] of Object.entries(S.settings.rates)) if (c !== nu) r[c] = Math.round(v / oldRate * 1e4) / 1e4 || 1; if (old !== nu) r[old] = Math.round(1 / oldRate * 1e4) / 1e4 || 1; S.settings.currency = nu; S.settings.rates = r; S.accounts.forEach(a => { if (a.currency !== nu && !r[a.currency]) r[a.currency] = 1; }); save(); render(); toast('Moneda principal: ' + nu); }
});

// ============ arranque ============
(function init() {
  const stored = load(); S = stored ? normalize(stored) : demoData();
  if (!stored) save();
  applyTheme(); processPlanned(); render(); lockApp();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else { processPlanned(); if (S.settings.pin && Date.now() - hiddenAt > 30000) lockApp(); else render(); }
  });
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { /* sin SW */ }
})();

</script>
